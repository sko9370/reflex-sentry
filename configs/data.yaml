# Configuration for `python -m reflex_sentry.data.build`.
# See docs/DATA_CONTRACT.md for what each pipeline stage produces.

seed: 42

raw_dir: data/raw
interim_dir: data/interim
processed_dir: data/processed
hn_seed_path: seeds/hard_negatives.csv
keywords_path: configs/cyber_keywords.txt

# Sources listed here are in scope by construction: every row from them gets
# in_scope=True regardless of whether the keyword prefilter matched, since they are
# already known to be cyber-relevant (hn_seed is AI-assisted cyber hard-negative drafts).
# kw_hits is still recorded from whatever the keyword list actually matched (possibly
# ""), so it's easy to see which bypassed rows the keyword list is missing.
prefilter_bypass_sources:
  - hn_seed

# Exact-dedupe tie-break: when the same normalized text appears in more than one
# source, keep the row from the source listed earliest here. Drafted hard
# negatives win first (highest value, least redundant elsewhere); OR-Bench and
# XSTest lose last since they are the most likely to overlap generic phrasing.
dedupe_preference:
  - hn_seed
  - aegis2
  - wildguardmix
  - beavertails
  - hh_redteam
  - toxic_chat
  - xstest
  - or_bench

# Near-duplicate grouping (MinHash/LSH over word shingles, see reflex_sentry/data/dedupe.py).
shingle_k: 5
minhash_perm: 32
minhash_bands: 8
dedupe_threshold: 0.8

# Split sizes and policy (reflex_sentry/data/split.py). Pool sizes are candidate counts for
# hand labeling, not final gold set sizes; expect to drop some as unusable during labeling.
split:
  # Entire source(s) held out for test_ood_pool, never trained/validated/tested on otherwise.
  # A list, so more than one source can be held out (the older singular `ood_source: <name>`
  # string is still accepted). Chosen 2026-09-27 after the first real build: toxic_chat alone
  # gave only 78 in-scope candidates, so all four small sources are held out together (real
  # users, human red-teamers, two crowd-annotated sets). They contributed <4% of train rows.
  ood_sources:
    - toxic_chat
    - aegis2
    - hh_redteam
    - beavertails
  # Candidates per pool; 300 items are hand-labeled from each (reflex_sentry.gold.sample defaults).
  val_pool_size: 400
  test_pool_size: 400
  test_ood_pool_size: 600
  hn_pool_ratio: 0.8            # share of hn_seed rows routed to val_pool/test_pool vs train
